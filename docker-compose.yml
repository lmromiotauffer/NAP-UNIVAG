services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${NAP_SQL_SENHA:?defina NAP_SQL_SENHA no .env}
    ports:
      - "127.0.0.1:1433:1433"
      # Só loopback. Use 127.0.0.1 nas conexões: o SqlClient troca "localhost" pelo nome da máquina (IP de rede).
      - "[::1]:1433:1433"
    volumes:
      - nap_sqlserver_dados:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
      - "[::1]:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
volumes:
  nap_sqlserver_dados:
